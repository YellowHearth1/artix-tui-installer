if cpuid -l; then
    havekernel="Y"
    title=""
    for kopt in x86_64 $kopts @kopts@; do
        if [ -n "$title" ] ; then
            title="$title $kopt";
        else
            title="$kopt";
        fi;
    done
    menuentry "Artix TUI Installer (CD/DVD/ISO)" --class=artix.x86_64 --id=artix-tui "$title @ro_opts@" {# set arguments above with the editor
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
    menuentry "Artix TUI Installer (Stick/HDD)" --class=artix.x86_64 "$title @rw_opts@" {# set arguments above with the editor
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
fi
if [ "${havekernel}" != "Y" ]; then
    menuentry --class=find.none "NO SUITABLE KERNELS AVAILABLE" {echo $@  echo "There are no kernels suitable for this machine available."
        echo ""
        if ! cpuid -l; then
            echo "This machine is NOT 64bit capable."
            for kk in /boot/vmlinu*x86_64; do
                if [ "$kk" != "/boot/vmlinu*x86_64" ]; then
                    have32="true"
                fi
            done
            if [ "${have32}" != "true" ]; then
                echo "There are no 32bit kernels available"
                echo "It appears you are trying to boot a 64bit release on a 32bit machine"
                echo "This cannot work!"
            fi
        fi
        echo "Press Escape to return to the main menu"
        sleep --interruptible 9999
        menu_reload
    }
fi

# ─── Artix TUI installer: boot straight in ───────────────────────────────────
# EVERYTHING ABOVE THIS LINE IS A VERBATIM COPY of artix-grub-live's own
# kernels.cfg. It is copied rather than written because the menu entry bodies
# decide how the kernel is found, and getting that subtly wrong produces an ISO
# that does not boot — the one failure with no way to debug it from inside.
# scripts/build-iso.sh diffs this copy against the installed package and warns
# when upstream changes, so the copy cannot rot unnoticed.
#
# Only these three lines are ours, and they are appended rather than edited in
# because `kernels.cfg` is the LAST file grub.cfg sources: `default` set earlier
# (grub.cfg's boot_menu sets default=2, which lands on the keyboard submenu) is
# overridden here, and nowhere else would stick.
#
# The fix is `default`, not `timeout`. The stock config already sets timeout=0
# and the menu appeared anyway, because `default=2` points at the KEYBOARD
# SUBMENU: with no timeout GRUB "boots" it at once, the submenu picks its own
# default (Cancel), Cancel calls menu_reload, and the reload re-runs grub.cfg
# with `loaded` already true — so variable.cfg is skipped, `timeout` is never
# set again, and the main menu sits there forever. Pointing default at a real
# kernel entry means none of that happens.
#
# `--id` rather than the title: an id is matched exactly, survives a rename, and
# is an OPTION, so it does not shift the positional arguments the entry body
# reads to find its kernel.
#
# hidden + 1s: the menu does not appear, but a keypress in that second brings it
# up. A plain timeout=0 would leave no way in at all — and the machine that
# needs the menu is precisely the one that will not boot without it.
default=artix-tui
timeout_style=hidden
timeout=1
