[package]
name = "artix-installer"
version = "0.0.3"
edition = "2021"
description = "TUI installer for an Artix/dinit based distribution"
license = "Apache-2.0"
repository = "https://github.com/YellowHearth1/artix-tui-installer"
readme = "../README.md"

[[bin]]
name = "artix-installer"
path = "src/main.rs"

[features]
# DEVELOPER TOOLS, OFF IN EVERY PUBLISHED BUILD.
#
# The mode menu carries two entries that exist only to test this installer: the
# simulated Wi-Fi radio, and "Test", which finishes a real install by breaking
# the system on purpose so recovery has something to repair. Neither is any use
# to somebody installing Artix, and the second is destructive by design — a menu
# row that wrecks a fresh install has no business in a release.
#
# A feature rather than deleted code: the tools stay in the tree, reviewable and
# compiled by CI, and `cargo build --release` simply does not include them.
#
#     cargo build --release --features devtools     # to get them back
devtools = []

[dependencies]
# TUI core. ratatui 0.30 + crossterm 0.29 (updated pair).
ratatui = "0.30"
crossterm = "0.29"

# Error handling
anyhow = "1"

# Serialization for state, locale files, machine-readable command output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Embed locale files into the binary (no separate files on the live ISO)
rust-embed = "8"

# Channels / async-ish log streaming without a full async runtime
crossbeam-channel = "0.5"

# Timezone list
chrono-tz = "0.10"

# Pseudo-terminal for interactive install mode: lets pacman think it's talking
# to a real terminal, so we can stream its output into the TUI and feed answers
# (provider numbers) back from an in-TUI input field.
portable-pty = "0.9"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

