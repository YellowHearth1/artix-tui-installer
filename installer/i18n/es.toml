warnmodal_live = "Este disco es un medio de arranque desde el cual ahora se ejecuta el instalador (se encontró un sistema de archivos tipo live-iso9660). Si instalas el sistema en este disco, borrarás el propio instalador y, con mucha probabilidad, la instalación se interrumpirá a mitad de camino. Elige este disco solo si de verdad quieres instalar el sistema en este USB y entiendes las consecuencias."
warnmodal_small = "El tamaño de este disco es menor que el recomendado de 20 GB. El sistema base cabrá, pero para un entorno gráfico completo con todas las aplicaciones quizá no haya suficiente espacio; la instalación podría fallar por falta de espacio. Recomendamos elegir un disco más grande o asegurarte de que el entorno y los paquetes seleccionados no sean muchos."
warnmodal_bios_on_uefi = "El equipo arrancó en modo UEFI, pero elegiste BIOS (Legacy). La instalación, con mucha probabilidad, no arrancará porque el cargador se escribirá en un formato que tu firmware no espera. Si no estás probando BIOS a propósito en una máquina virtual, elige UEFI."
warnmodal_uefi_on_bios = "El equipo arrancó en modo BIOS (Legacy), pero elegiste UEFI. La instalación, con mucha probabilidad, no arrancará porque tu firmware no soporta arranque UEFI en el modo actual. Elige BIOS o reinicia el equipo en modo UEFI en la configuración del firmware."
