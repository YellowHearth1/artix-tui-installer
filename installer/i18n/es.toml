fsopt_summary = "Opciones del sistema de archivos"
fsopt_none = "por defecto (sin opciones)"
fsopt_open_hint = "[o] configurar"
fsopt_modal_title = "Opciones del sistema de archivos"
fsopt_modal_hint = "Espacio cambiar · ↑/↓ opciones · w/s descripción · Intro/Esc cerrar"
fsdesc_noatime = "No registrar la hora del último acceso a cada archivo (atime). Ventaja: evita un micro‑escritura en cada lectura — un poco menos de desgaste del SSD y un poco más rápido al leer. Pérdida: programas que dependen del tiempo de acceso (algunos clientes de correo, así como utilidades de respaldo o limpieza de caché que eliminan archivos según antigüedad) pueden funcionar mal. Típicamente desactivado: Linux ya usa relatime, que evita la mayoría de escrituras de atime, así que la ganancia adicional es pequeña."
fsdesc_subvolumes = "Crear subvolúmenes separados en btrfs: @ (sistema), @home (tus archivos), @snapshots, @log, @cache. Ventaja: instantáneas del sistema separadas de los datos — puedes volver atrás en segundos tras una actualización fallida sin tocar /home; listo para snapper/Timeshift. @log y @cache no entran en instantáneas del sistema, así que no las infla. Pérdida: estructura un poco más compleja, pero en esencia no pierdes nada. Recomendado para btrfs."
fsopt_snapshots = "Instantáneas automáticas (snapper + snap-pac)"
fsdesc_snapshots = "Tomar instantánea btrfs antes y después de cada acción de pacman (instalar/actualizar/eliminar) usando snapper + snap-pac. Ventaja: una actualización fallida se revierte en segundos — vuelves al estado «antes». Activa subvolúmenes (requiere @snapshots). Limpieza de instantáneas según cron (porque en dinit no hay temporizadores systemd), mantener aproximadamente las últimas ~10. Pérdida: un poco de espacio para instantáneas y una pequeña demora en cada acción de pacman. Muy cómodo para un sistema diario en estilo Arch. La reversión es con artix-rollback (en GRUB también hay System Rollback en el menú de arranque)."
fsdesc_compress = "Comprimir de forma transparente con zstd al escribir. Ventaja: ahorro de espacio (en texto, código y logs suele 30–50%) e incluso lectura más rápida en discos lentos, porque se leen menos bytes. Pérdida: algo de carga de CPU al escribir; lo que ya está comprimido (video, JPEG, archivos) se detecta y no se toca. Para un sistema diario, casi siempre vale la pena."
fsdesc_discard = "Avisar a los SSD de los bloques liberados (TRIM) de manera continua en segundo plano. Ventaja: el SSD mantiene velocidad de escritura con el tiempo y no se ralentiza a medida que se llena. Pérdida: útil solo en SSD/NVMe — en HDD común no tiene sentido; la forma async funciona en segundo plano, así que no frena escrituras como el discard síncrono antiguo. Alternativa: temporizador periódico fstrim."
fschar_ext4 = "ext4 — confiable, rápido y un sistema de archivos clásico probado; elección segura para la mayoría de sistemas."
fschar_btrfs = "btrfs — instantáneas y reversión instantánea, compresión zstd y subvolúmenes, pero solo si están habilitados."
fschar_xfs = "xfs — alto rendimiento en archivos grandes y escrituras en paralelo; no se puede reducir el tamaño del volumen."
fschar_f2fs = "f2fs — diseñado para memoria flash y SSD (teléfonos, eMMC, algunos NVMe)."
fschar_jfs = "jfs — ligero, con poca carga de CPU, pero con soporte débil (obsoleto)."
fschar_ext3 = "ext3 — sistema de archivos con journaling más antiguo; si no hay una razón importante, elige ext4 (obsoleto)."
fschar_ext2 = "ext2 — sin journaling; adecuado para memorias USB, pero más riesgoso ante pérdida de energía (obsoleto)."
fsopt_cta = "Presiona [o] para definir parámetros adicionales."
fsopt_encrypt = "Cifrado (LUKS)"
fsdesc_encrypt = "Cifra todo el disco con LUKS. Ventaja: sin la clave, los datos no son accesibles — protege si el disco se roba o se pierde. Desbloqueo automático: la clave se guarda en la raíz cifrada, así que no se necesita otro password al arrancar. Pérdida: algo de sobrecarga al cifrar; solo tiene sentido si la raíz también está cifrada (de lo contrario la clave quedaría en claro)."
