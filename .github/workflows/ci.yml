name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run the checks by hand from the Actions tab.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · clippy · fmt · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache the registry and the target dir: a warm run finishes in seconds
      # instead of rebuilding every dependency from scratch.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            installer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('installer/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting first: it's instant, and a diff here means the rest of the
      # review is going to be noise.
      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      # -D warnings makes every lint an error. Clippy catches what the compiler
      # accepts but a reviewer would not: needless clones, redundant closures,
      # comparison chains that should be matches.
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release

  # The VM setup helper is a crate of its own, so the job above never sees it.
  # Unchecked code in the repository is code that rots: it is small, it builds in
  # seconds, and the alternative is finding out it stopped compiling on the
  # morning somebody needs it.
  vm-setup:
    name: vm-setup · clippy · fmt · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vm-setup
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # The install plan embeds a lot of shell. `dash -n` parses it as POSIX sh —
  # the actual interpreter in the chroot — so a bashism or an unbalanced quote
  # is caught here rather than halfway through someone's installation.
  shell:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dash and shellcheck
        run: sudo apt-get update && sudo apt-get install -y dash shellcheck

      - name: Check the shipped scripts
        run: |
          fail=0
          for f in $(find scripts installer/src/assets -name '*.sh' 2>/dev/null); do
            if dash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

      # dash answers "does it parse"; shellcheck answers "will it bite".
      # SC2154-style false positives are waived inline, next to the line,
      # with the reason — not here, where nobody would see it.
      - name: Lint the shipped scripts
        run: shellcheck -S warning scripts/*.sh installer/src/assets/sh/*.sh

  # The version on screen comes from Cargo.toml. The CHANGELOG is written by
  # hand. When they disagree, the number a user reports means nothing — which
  # defeats the entire point of showing it.
  version:
    name: version matches changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare Cargo.toml and CHANGELOG.md
        run: |
          cargo_ver=$(grep -m1 '^version' installer/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          log_ver=$(grep -m1 '^## \[' CHANGELOG.md | sed 's/^## \[\([0-9.]*\)\].*/\1/')
          echo "Cargo.toml: $cargo_ver"
          echo "CHANGELOG:  $log_ver"
          if [ "$cargo_ver" != "$log_ver" ]; then
            echo "::error::Cargo.toml says $cargo_ver but the CHANGELOG's newest entry is $log_ver"
            exit 1
          fi

  # Every shipped translation must define exactly the same keys. A key present
  # in one file and missing from another renders as a raw identifier on screen —
  # in the language whoever wrote it probably does not read.
  i18n:
    name: translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare every translation against uk.toml
        run: |
          python3 - <<'EOF'
          import sys, tomllib, pathlib

          def keys(d, prefix=""):
              out = set()
              for k, v in d.items():
                  if isinstance(v, dict):
                      out |= keys(v, f"{prefix}{k}.")
                  else:
                      out.add(f"{prefix}{k}")
              return out

          def load(name):
              with open(f"installer/i18n/{name}.toml", "rb") as f:
                  return keys(tomllib.load(f))

          # Ukrainian is where new strings are written first, so it is the
          # reference. Discovered from disk rather than hard-coded: a language
          # added without touching this file would otherwise go unchecked, which
          # is exactly how es.toml could have drifted.
          ref = load("uk")
          others = sorted(
              p.stem for p in pathlib.Path("installer/i18n").glob("*.toml")
              if p.stem != "uk"
          )
          print(f"reference uk.toml: {len(ref)} keys")
          print(f"checking: {', '.join(others)}")

          bad = False
          for name in others:
              other = load(name)
              for k in sorted(ref - other):
                  print(f"missing from {name}.toml: {k}")
                  bad = True
              for k in sorted(other - ref):
                  print(f"missing from uk.toml (present in {name}.toml): {k}")
                  bad = True

          if bad:
              sys.exit(1)
          print(f"parity ok across {len(others) + 1} languages")
          EOF
